<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart2Heart</title>
    <link rel="icon" href="logo.svg" type="image/svg+xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: white; color: black; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { text-align: center; padding: 40px 20px; max-width: 500px; }
        .heart { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
        p { font-size: 16px; line-height: 1.6; margin-bottom: 8px; color: #333; }
        .tag { font-size: 13px; color: #999; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">💜</div>
        <h1>Heart2Heart is temporarily down</h1>
        <p>We're updating the app and will be back shortly.</p>
        <p>Thanks for your patience!</p>
        <div class="tag">Created by Logan Robinson</div>
    </div>
</body>
</html>
